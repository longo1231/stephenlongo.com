<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>stephenlongo.com</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #191919;
            color: #e0e0e0;
            font-family: Georgia, 'Times New Roman', serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .cover {
            width: 100%;
            max-height: 300px;
            overflow: hidden;
        }

        .cover img {
            width: 100%;
            object-fit: cover;
            display: block;
            filter: grayscale(100%);
        }

        .content {
            max-width: 720px;
            width: 100%;
            padding: 3rem 1.5rem;
        }

        .quote {
            text-align: center;
            margin-bottom: 3rem;
        }

        .quote blockquote {
            font-style: italic;
            font-size: 1.2rem;
            letter-spacing: 0.04em;
            line-height: 1.6;
            color: #d4d0c8;
        }

        .quote cite {
            display: block;
            margin-top: 1rem;
            font-style: italic;
            font-size: 1rem;
            color: #d4d0c8;
        }

        .links {
            list-style: none;
        }

        .links li {
            margin-bottom: 0.5rem;
        }

        .links a {
            color: #e0e0e0;
            text-decoration: none;
            font-size: 1rem;
            font-family: monospace;
            transition: color 0.2s;
        }

        .links a:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        .links .icon {
            margin-right: 0.4rem;
        }
    </style>
</head>
<body>
    <div class="cover">
        <img src="cover.jpg" alt="Wanaka Tree, New Zealand">
    </div>

    <div class="content">
        <div class="quote">
            <blockquote>The basis of optimism is sheer terror</blockquote>
            <cite>Oscar Wilde</cite>
        </div>

        <ul class="links">
            <li><span class="icon">&#128210;</span> <a href="#">Bookshelf</a></li>
            <li><span class="icon">&#128279;</span> <a href="#">My 2024 Matrix</a></li>
        </ul>
    </div>
</body>
</html>
